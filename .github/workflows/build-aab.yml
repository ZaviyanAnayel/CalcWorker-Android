name: Build signed release AAB

# Manual build of the production Android App Bundle for Google Play.
# The upload keystore is NEVER committed to the repo. It is decoded at build
# time from the KEYSTORE_BASE64 repository secret (see README "Release signing").

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this build (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: GitHub-hosted ubuntu runners already ship the Android SDK
      # (ANDROID_HOME pre-set), so no separate SDK setup step is needed.

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set. See README 'Release signing'." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Verify AAB signature
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "Built: $AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$AAB" | head -5

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcworker-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
