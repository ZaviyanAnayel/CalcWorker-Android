name: Build native CalcWorker AAB + debug APK

# Builds the native Kotlin/Compose app.
# - Unsigned (signed=false, default): for QA.
# - Signed (signed=true): signs the release AAB with the upload keystore from the
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repo secrets.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this build (e.g. 2.0.0)"
        required: false
        default: "2.0.0"
      signed:
        description: "Sign the release AAB with the upload keystore secrets (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: GitHub-hosted ubuntu runners already ship the Android SDK
      # (ANDROID_HOME pre-set), so no separate SDK setup step is needed.

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        if: ${{ inputs.signed == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release AAB
        run: |
          chmod +x gradlew
          if [ "${{ inputs.signed }}" = "true" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            ./gradlew bundleRelease --no-daemon --stacktrace
          fi

      - name: Verify AAB signature
        if: ${{ inputs.signed == 'true' }}
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "Built: $AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$AAB" | head -5

      - name: Build debug APK (unsigned)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcworker-${{ inputs.version_name }}-${{ inputs.signed == 'true' && 'signed' || 'unsigned' }}-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcworker-${{ inputs.version_name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
