name: Build native CalcWorker AAB + debug APK (unsigned)

# Builds the native Kotlin/Compose app. Unsigned artifacts are for QA;
# release signing is added separately once the upload keystore is available.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this build (e.g. 2.0.0)"
        required: false
        default: "2.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: GitHub-hosted ubuntu runners already ship the Android SDK
      # (ANDROID_HOME pre-set), so no separate SDK setup step is needed.

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build release AAB (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build debug APK (unsigned)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcworker-${{ inputs.version_name }}-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcworker-${{ inputs.version_name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
