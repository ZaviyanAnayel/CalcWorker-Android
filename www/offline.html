<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>Offline — CalcWorker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #06080d;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .card { max-width: 340px; width: 100%; }
  .logo {
    width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px;
    box-shadow: 0 8px 32px rgba(37, 99, 235, .35);
    display: block;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: .2px; }
  p { font-size: 14px; line-height: 1.6; color: #8b9bb4; margin-bottom: 26px; }
  .retry {
    display: inline-block; border: 0; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #fff;
    padding: 14px 44px; border-radius: 14px;
    background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
    box-shadow: 0 6px 24px rgba(37, 99, 235, .45);
  }
  .retry:active { transform: scale(.97); }
  .hint { margin-top: 18px; font-size: 12px; color: #54647c; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    display: none; margin: 18px auto 0;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.checking .spinner { display: block; }
  body.checking .retry { opacity: .55; pointer-events: none; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon-512.png" alt="CalcWorker">
    <h1>You&rsquo;re offline</h1>
    <p>CalcWorker needs an internet connection to load its calculators. Please check your connection and try again.</p>
    <button class="retry" id="retryBtn" type="button">Retry</button>
    <div class="spinner" aria-hidden="true"></div>
    <div class="hint">The app will reconnect automatically when you&rsquo;re back online.</div>
  </div>
  <script>
    (function () {
      var HOME = 'https://calcworker.com/';
      var retrying = false;
      function goHome() {
        if (retrying) return;
        retrying = true;
        document.body.classList.add('checking');
        // Give the spinner a beat, then navigate home.
        setTimeout(function () { window.location.href = HOME; }, 450);
      }
      document.getElementById('retryBtn').addEventListener('click', goHome);
      window.addEventListener('online', goHome);
    })();
  </script>
</body>
</html>
